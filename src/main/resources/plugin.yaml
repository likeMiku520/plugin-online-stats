# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest

apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  # The name defines how the plugin is invoked, A unique name
  name: online-stats
spec:
  enabled: true
  requires: ">=2.25.0"
  author:
    name: fufu大王
    website: https://blog.fufu520.cn
  logo: logo.webp
  homepage: https://blog.fufu520.cn
  repo: https://github.com/likeMiku520/plugin-online-stats
  issues: https://github.com/likeMiku520/plugin-online-stats/issues
  displayName: "在线访客统计"
  description: "看看现在有几个人在站上、都从哪来、看了什么。历史访客会保存下来，后台可以查属地、设备和访问记录。"
  settingName: online-stats-settings
  configMapName: online-stats-configmap
  license:
    - name: "GPL-3.0"
      url: "https://www.gnu.org/licenses/gpl-3.0.html"
