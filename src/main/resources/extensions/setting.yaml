apiVersion: v1alpha1
kind: Setting
metadata:
  name: online-stats-settings
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $formkit: number
          name: heartbeatInterval
          label: 心跳间隔（秒）
          help: 前台页面上报心跳的频率，越小越实时、请求越多。
          value: 15
          min: 5
          max: 120
        - $formkit: number
          name: onlineTimeout
          label: 在线判定超时（秒）
          help: 超过该时长没有心跳的访客会被判定为离线。
          value: 60
          min: 20
          max: 600
        - $formkit: text
          name: siteHomepage
          label: 本站域名
          help: 填写你的博客域名，例如 blog.fufu520.cn。用于在「来源站点」里排除自己站内的跳转。
          value: ""
        - $formkit: number
          name: officialViewsAdjustment
          label: 官方总浏览量修正值
          help: 直接写入 Halo 的官方计数数据，所以后台仪表盘和主题前台都会同步增加。用于换博客、迁移数据后把旧站的历史浏览量补回来：填一个整数表示在官方总数上补这么多，填 0 或留空表示不修正（会把之前写入的修正清除）。
          value: 0
        - $formkit: checkbox
          name: showIpInConsole
          label: 后台显示访客 IP 地址
          help: 关闭后后台不再展示访客 IP，保护访客隐私。
          value: true
        - $formkit: checkbox
          name: chatEnabled
          label: 即时通讯
          help: |-
            打开后，访客页面每 5 秒取一次新消息，你可以在「访客明细」点某个访客的「更多」给他发消息，对方页面会弹出对话框直接回复。
            关掉后前台不再发起任何对话请求，后台也发不出去。此功能仅为学习测试使用。
          value: false
        - $formkit: checkbox
          name: chatRequireHttps
          label: 仅允许 HTTPS
          if: "$get(chatEnabled).value === true"
          help: 打开后，只有能确认是 HTTPS 的请求才允许使用对话接口。站点走 CDN 或反向代理时，服务端常常只看得到回源那一跳，确认不了就会误拒，保持关闭即可。
          value: false
        - $formkit: text
          name: chatAvatar
          label: 对话头像（备用）
          help: 默认用当前登录账号自己的头像。账号没有头像、或者想让所有管理员统一显示同一张图时，在这里填一个图片地址。
          value: ""
        - $formkit: text
          name: geoEndpoint
          label: IP 属地查询接口
          help: 必须包含 %s 作为 IP 占位符。属地不会自动查询，只有在点击「查询属地」时才请求。
          value: "https://api.mir6.com/api/ip?ip=%s&type=json"
        - $formkit: number
          name: historyRetentionDays
          label: 访客记录保留天数
          help: 超过该天数的访客明细会被自动清理，文章与每日统计不会删除。对话记录也按这个天数清理。
          value: 90
          min: 1
          max: 3650
        - $formkit: number
          name: maxRecords
          label: 访客记录最大条数
          help: 超过上限时优先删除最久未活跃的记录。
          value: 5000
          min: 100
          max: 100000