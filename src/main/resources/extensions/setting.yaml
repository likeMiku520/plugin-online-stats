apiVersion: v1alpha1
kind: Setting
metadata:
  name: online-stats-settings
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $formkit: number
          name: heartbeatInterval
          label: 心跳间隔（秒）
          help: 前台页面上报心跳的频率，越小越实时、请求越多。
          value: 15
          min: 5
          max: 120
        - $formkit: number
          name: onlineTimeout
          label: 在线判定超时（秒）
          help: 超过该时长没有心跳的访客会被判定为离线。
          value: 60
          min: 20
          max: 600
        - $formkit: text
          name: siteHomepage
          label: 本站域名
          help: 填写你的博客域名，例如 blog.fufu520.cn。用于在「来源站点」里排除自己站内的跳转。
          value: ""
        - $formkit: number
          name: officialViewsAdjustment
          label: 官方总浏览量修正值
          help: 直接写入 Halo 的官方计数数据，所以后台仪表盘和主题前台都会同步增加。用于换博客、迁移数据后把旧站的历史浏览量补回来：填一个整数表示在官方总数上补这么多，填 0 或留空表示不修正（会把之前写入的修正清除）。
          value: 0
        - $formkit: checkbox
          name: showIpInConsole
          label: 后台显示访客 IP 地址
          help: 关闭后后台不再展示访客 IP，保护访客隐私。
          value: true
        - $formkit: checkbox
          name: chatEnabled
          label: 即时通讯（后台给访客发消息）
          help: |-
            总开关。打开后，前台页面每 5 秒查询一次新消息，在「访客明细」点某个 IP 的「更多」就能给这个访客发消息，对方的页面上会弹出对话卡片并可以直接回复；关闭后前台不再有任何对话相关的请求，后台也不能再发送。
            提示：此功能仅为学习测试使用，请勿用于正式环境。
          value: true
        - $formkit: checkbox
          name: chatRequireHttps
          label: 仅允许 HTTPS（推荐开启）
          help: 打开后，对话接口在非加密连接上直接拒绝（返回 403），消息文本不会以明文经过网络。站点在反向代理后面、代理没有设置 X-Forwarded-Proto 时会出现这种情况，可临时关闭本项排查。
          value: true
        - $formkit: text
          name: chatAvatar
          label: 对话卡片里显示的头像
          help: 访客看到的对话卡片和消息都用这个头像。留空或不是完整网址时使用默认头像。
          value: "https://blog.fufu520.cn/upload/fufu_touming.webp"
        - $formkit: text
          name: geoEndpoint
          label: IP 属地查询接口
          help: 必须包含 %s 作为 IP 占位符。属地不会自动查询，只有在点击「查询属地」时才请求。
          value: "https://api.mir6.com/api/ip?ip=%s&type=json"
        - $formkit: number
          name: historyRetentionDays
          label: 访客记录保留天数
          help: 超过该天数的访客明细会被自动清理，文章与每日统计不会删除。对话记录也按这个天数清理。
          value: 90
          min: 1
          max: 3650
        - $formkit: number
          name: maxRecords
          label: 访客记录最大条数
          help: 超过上限时优先删除最久未活跃的记录。
          value: 5000
          min: 100
          max: 100000