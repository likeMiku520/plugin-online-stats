apiVersion: v1alpha1
kind: Setting
metadata:
  name: online-stats-settings
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $formkit: number
          name: heartbeatInterval
          label: 心跳间隔（秒）
          help: 前台页面上报心跳的频率，越小越实时、请求越多。
          value: 15
          min: 5
          max: 120
        - $formkit: number
          name: onlineTimeout
          label: 在线判定超时（秒）
          help: 超过该时长没有心跳的访客会被判定为离线。
          value: 60
          min: 20
          max: 600
        - $formkit: text
          name: siteHomepage
          label: 本站域名
          help: 填写你的博客域名，例如 blog.fufu520.cn。用于在「来源站点」里排除自己站内的跳转。
          value: ""
        - $formkit: number
          name: officialViewsAdjustment
          label: 官方总浏览量修正值
          help: 加到 Halo 官方总浏览量上的数字。比如换过博客或迁移过数据，官方计数从 0 开始，把旧站的历史浏览量填在这里即可对上总数。留空或填 0 表示不修正。
          value: 0
        - $formkit: checkbox
          name: showIpInConsole
          label: 后台显示访客 IP 地址
          help: 关闭后后台不再展示访客 IP，保护访客隐私。
          value: true
        - $formkit: text
          name: geoEndpoint
          label: IP 属地查询接口
          help: 必须包含 %s 作为 IP 占位符。属地不会自动查询，只有在点击「查询属地」时才请求。
          value: "https://api.mir6.com/api/ip?ip=%s&type=json"
        - $formkit: number
          name: historyRetentionDays
          label: 访客记录保留天数
          help: 超过该天数的访客明细会被自动清理，文章与每日统计不会删除。
          value: 90
          min: 1
          max: 3650
        - $formkit: number
          name: maxRecords
          label: 访客记录最大条数
          help: 超过上限时优先删除最久未活跃的记录。
          value: 5000
          min: 100
          max: 100000