apiVersion: v1alpha1
kind: Setting
metadata:
  name: online-stats-settings
spec:
  forms:
    - group: basic
      label: 统计设置
      formSchema:
        - $formkit: number
          name: heartbeatInterval
          label: 心跳间隔（秒）
          help: 前台页面上报心跳的频率，越小越实时、请求越多。
          value: 15
          min: 5
          max: 120
        - $formkit: number
          name: onlineTimeout
          label: 在线判定超时（秒）
          help: 超过该时长没有心跳的访客会被判定为离线。
          value: 60
          min: 20
          max: 600
        - $formkit: text
          name: siteHomepage
          label: 本站域名
          help: 填写你的博客域名，例如 blog.fufu520.cn。用于在「来源站点」里排除自己站内的跳转。
          value: ""
        - $formkit: number
          name: officialViewsAdjustment
          label: 官方总浏览量修正值
          help: 直接写入 Halo 的官方计数数据，所以后台仪表盘和主题前台都会同步增加。用于换博客、迁移数据后把旧站的历史浏览量补回来：填一个整数表示在官方总数上补这么多，填 0 或留空表示不修正（会把之前写入的修正清除）。
          value: 0
        - $formkit: checkbox
          name: showIpInConsole
          label: 后台显示访客 IP 地址
          help: 关闭后后台不再展示访客 IP，保护访客隐私。
          value: true

    - group: chat
      label: 即时通讯
      formSchema:
        - $formkit: checkbox
          name: chatEnabled
          id: chatEnabled
          label: 即时通讯
          help: |-
            打开后，访客页面每 5 秒取一次新消息，你可以在「访客明细」点某个访客的「更多」给他发消息，对方页面会弹出对话框直接回复。
            关掉后前台不再发起任何对话请求，后台也发不出去。此功能仅为学习测试使用。
          value: false
        - $formkit: checkbox
          name: chatRequireHttps
          label: 仅允许 HTTPS
          help: 打开后，只有能确认是 HTTPS 的请求才允许使用对话接口。站点走 CDN 或反向代理时，服务端常常只看得到回源那一跳，确认不了就会误拒，保持关闭即可。
          value: false
        - $formkit: text
          name: chatAvatar
          label: 对话头像（留空即可）
          help: 留空时，访客看到的头像是发消息那个管理员自己账号的头像；填了图片地址，则所有管理员统一使用这张图。
          value: ""
        - $formkit: checkbox
          name: chatAnnounceEnabled
          label: 启用自动访客消息
          help: |-
            打开后，第一次来的访客会收到一条自动发出的对话，相当于一条公告：页面会直接弹出对话框把内容给他看，他也可以像平常一样接着回复。
            每个访客设备只发一次；已经聊过的访客不会再收到。这项需要先打开上面的「即时通讯」。
          value: false
        - $formkit: textarea
          name: chatAnnounceText
          label: 自动消息内容
          rows: 6
          help: 想写几行就写几行，换行会保留。留空则不会发送任何内容。
          value: ""
        - $formkit: text
          name: chatAnnounceName
          label: 发信人名称
          help: 访客看到这条消息是谁发的，默认是「访客消息」。
          value: "访客消息"
        - $formkit: attachment
          name: chatAnnounceAvatar
          label: 发信人头像
          accepts: ["image/*"]
          help: 可以上传图片、从附件库选择或直接填图片地址。留空则只显示名称的首字。
          value: ""

    - group: data
      label: 数据与属地
      formSchema:
        - $formkit: text
          name: geoEndpoint
          label: IP 属地查询接口
          help: 用 {ip} 表示要查询的地址，例如 https://api.mir6.com/api/ip_json?ip={ip}。属地不会自动查询，只有在点击「查询属地」时才请求。
          value: "https://api.mir6.com/api/ip_json?ip={ip}"
        - $formkit: textarea
          name: geoParams
          label: 附加请求参数
          rows: 4
          help: |-
            每行一个，写成 名称=值，例如 token=你的密钥 或 lang=zh-CN。会拼到接口地址后面，留空则不加。
            用不上的行整行删掉即可。
          value: ""
        - $formkit: textarea
          name: geoFields
          label: 要显示的字段
          rows: 9
          help: |-
            每行一个，写成 显示名称=接口返回里的位置，例如 城市=data.city。点号可以进到嵌套对象里。
            想显示哪些就留哪些，不想要的行整行删掉；全部删掉则使用插件自带的省市运营商等字段。
          value: |-
            国家=country
            省份=province
            城市=city
            区县=districts
            运营商=isp
            网络=net
            归属地=location
        - $formkit: number
          name: historyRetentionDays
          label: 访客记录保留天数
          help: 超过该天数的访客明细会被自动清理，文章与每日统计不会删除。对话记录也按这个天数清理。
          value: 90
          min: 1
          max: 3650
        - $formkit: number
          name: maxRecords
          label: 访客记录最大条数
          help: 超过上限时优先删除最久未活跃的记录。
          value: 5000
          min: 100
          max: 100000
        - $formkit: text
          name: geoResetToken
          label: 恢复默认属地设置
          help: |-
            在这个框里填 reset 再保存本页，接口地址、附加参数和字段列表都会恢复成插件自带的默认值；保存后这一格会自己清空。
            想取消就清空这一格再保存。
          value: ""